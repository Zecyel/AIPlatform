services:
  mongodb:
    image: mongo:latest
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: always

  app:
    image: ghcr.io/zecyel/ai:latest
    ports:
      - "3000:3000"
    depends_on:
      - mongodb
    environment:
      - NUXT_PRIVATE_JWT_SECRET=your_nuxt_private_jwt_secret

volumes:
  mongodb_data: